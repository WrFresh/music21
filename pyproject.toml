# Create a score
score = stream.Score()
score.append(tempo.MetronomeMark(number=96))  # moderate jazz tempo

# Define parts
parts = {
    "Baritone Sax": instrument.BaritoneSaxophone(),
    "Trumpet": instrument.Trumpet(),
    "Alto Sax": instrument.AltoSaxophone()
}

# Choose a jazzy key
composition_key = key.Key('Bb')  # common jazz key for sax and trumpet

# Create a part for each instrument
for name, instr in parts.items():
    part = stream.Part()
    part.append(instr)
    part.append(meter.TimeSignature('4/4'))
    part.append(composition_key)
    
    # Create 16 measures with some jazz-like phrasing (using swing-friendly rhythms and blue notes)
    for i in range(16):
        m = stream.Measure(number=i+1)
        if name == "Baritone Sax":
            # Root-heavy, rhythmic bassline with syncopation
            m.append(note.Rest(quarterLength=0.5))
            m.append(note.Note('Bb2', quarterLength=1))
            m.append(note.Note('D3', quarterLength=1))
            m.append(note.Rest(quarterLength=1.5))
        elif name == "Trumpet":
            # Melody with blues inflections
            m.append(note.Note('F4', quarterLength=1))
            m.append(note.Note('Ab4', quarterLength=0.5))
            m.append(note.Note('Bb4', quarterLength=1))
            m.append(note.Rest(quarterLength=1.5))
        elif name == "Alto Sax":
            # Harmonizing line with counter-melody
            m.append(note.Rest(quarterLength=1))
            m.append(note.Note('D4', quarterLength=1))
            m.append(note.Note('F4', quarterLength=1))
            m.append(note.Rest(quarterLength=1))
        part.append(m)
    score.append(part)

# Show the score
score.write('musicxml.pdf', fp='/mnt/data/Jazzy_Trio_16_Measures.pdf')
score.write('musicxml', fp='Jazzy_Trio_16_Measures.musicxml')
